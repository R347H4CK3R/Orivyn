name: Verify isolated native transcript adapter
on:
  push:
    branches: [codex/native-transcript-adapter-20261115]
permissions:
  contents: read
jobs:
  portable:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: '6.1.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install jinja2==3.1.6
      - name: Test strict adapter and exact extracted template
        run: python3 scripts/test_native_transcript.py --output "$RUNNER_TEMP/native-transcript"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-transcript-${{ github.sha }}
          path: ${{ runner.temp }}/native-transcript
          retention-days: 7
