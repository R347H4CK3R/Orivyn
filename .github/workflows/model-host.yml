name: Verify real local model on Linux
on:
  workflow_dispatch:
  push:
    branches: [codex/read-title-examples-20261115]
    paths:
      - '.github/workflows/model-host.yml'
      - 'JarvisEVO/Core/AIProvider.swift'
      - 'JarvisEVO/Core/Local*.swift'
      - 'JarvisEVO/Providers/Local/**'
      - 'JarvisEVO/Resources/LocalAgentCore.js'
      - 'scripts/run_llama_engine_smoke.py'
      - 'scripts/swift-smoke/**'
      - 'Diagnostics/NativeTools/download.py'
permissions:
  contents: read
concurrency:
  group: orivyn-model-host-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  actual-model:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: '6.1.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orivyn-host-evidence"
          git init "$RUNNER_TEMP/orivyn-host-source"
          git -C "$RUNNER_TEMP/orivyn-host-source" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/orivyn-host-source" fetch --depth 1 origin 2496f9c14965c39589f53eea31bdb6d762b1d360
          git -C "$RUNNER_TEMP/orivyn-host-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/orivyn-host-source" rev-parse HEAD)" = 2496f9c14965c39589f53eea31bdb6d762b1d360
          cmake -S "$RUNNER_TEMP/orivyn-host-source" -B "$RUNNER_TEMP/orivyn-host-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_BLAS=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF > "$RUNNER_TEMP/orivyn-host-evidence/configure.log" 2>&1
          cmake --build "$RUNNER_TEMP/orivyn-host-build" --target llama --parallel 2 > "$RUNNER_TEMP/orivyn-host-evidence/build.log" 2>&1
          mkdir -p "$RUNNER_TEMP/orivyn-host-headers"
          cp "$RUNNER_TEMP/orivyn-host-source/include/"*.h "$RUNNER_TEMP/orivyn-host-source/ggml/include/"*.h "$RUNNER_TEMP/orivyn-host-headers/"
      - name: Download and verify exact Q4 model
        run: python3 Diagnostics/NativeTools/download.py --model-id qwen3-1.7b-q4_k_m --output "$RUNNER_TEMP/orivyn-host-model/Qwen3-1.7B-Q4_K_M.gguf"
      - name: Execute actual reviewed workflow cases
        shell: bash
        run: |
          set -uo pipefail
          set +e
          aggregate=0
          for fixture in orchid maple pagination quoted-title; do
            ORIVYN_CONVERSATION_FIXTURE="$fixture" python3 -B scripts/run_llama_engine_smoke.py --scenario reviewed-conversation-agent --swiftc "$(command -v swiftc)" --runtime "$RUNNER_TEMP/orivyn-host-build/bin" --headers "$RUNNER_TEMP/orivyn-host-headers" --model "$RUNNER_TEMP/orivyn-host-model/Qwen3-1.7B-Q4_K_M.gguf" --output "$RUNNER_TEMP/orivyn-host-evidence/$fixture" --run-timeout 600 > "$RUNNER_TEMP/orivyn-host-evidence/$fixture.log" 2>&1
            result=$?
            printf '%s=%s\n' "$fixture" "$result" | tee -a "$RUNNER_TEMP/orivyn-host-evidence/outcomes.txt"
            if [[ "$result" != 0 ]]; then aggregate=1; fi
          done
          exit "$aggregate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-model-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/orivyn-host-evidence/**/*.json
            ${{ runner.temp }}/orivyn-host-evidence/**/*.log
            ${{ runner.temp }}/orivyn-host-evidence/**/*.txt
            ${{ runner.temp }}/orivyn-host-evidence/**/*.gbnf
          retention-days: 1
          if-no-files-found: warn
