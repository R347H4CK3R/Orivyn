name: Verify isolated app dependency graphs
on:
  workflow_dispatch:
  push:
    branches: [codex/lean-peer-build-20261115]
permissions:
  contents: read
jobs:
  graph-and-build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Validate generated graphs and compile lean app and test targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/project-graph
          git rev-parse HEAD > artifacts/project-graph/source-commit.txt
          xcodebuild -version > artifacts/project-graph/xcode-version.txt
          python3 -B -m unittest discover -s scripts/tests -p test_generate_project.py -v
          bash scripts/bootstrap_llama.sh
          python3 scripts/materialize_guest.py Fixtures/maintained.img.gz JarvisEVO/Resources/VMAssets/maintained.img
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 scripts/generate_project.py --peer
          plutil -convert json -o artifacts/project-graph/peer.json JarvisEVO.xcodeproj/project.pbxproj
          python3 scripts/verify_project_graph.py artifacts/project-graph/peer.json --peer
          ORIVYN_NATIVE_FEATURES='' python3 scripts/generate_project.py
          plutil -convert json -o artifacts/project-graph/shipping.json JarvisEVO.xcodeproj/project.pbxproj
          python3 scripts/verify_project_graph.py artifacts/project-graph/shipping.json
          start=$(date +%s)
          xcodebuild -project JarvisEVO.xcodeproj -scheme JarvisEVO -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/orivyn-lean-build" CODE_SIGNING_ALLOWED=NO ORIVYN_NATIVE_FEATURES='' build-for-testing > artifacts/project-graph/device-build.log 2>&1
          echo "$(( $(date +%s) - start ))" > artifacts/project-graph/build-seconds.txt
          printf '%s\n' 'PASS: generated shipping/peer graphs; stock runtime SPI-off unsigned iOS app and test-target compile. No simulator execution, shipping native inference, SPI-on build, device runtime or release acceptance.' > artifacts/project-graph/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-graph-${{ github.sha }}
          path: artifacts/project-graph
          retention-days: 2
          if-no-files-found: error
