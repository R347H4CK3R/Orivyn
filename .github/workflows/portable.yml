name: Verify portable development
on:
  workflow_dispatch:
  push:
    branches: [codex/complete-capabilities-20261114]
    paths:
      - 'JarvisEVO/**'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/workflows/portable.yml'
permissions:
  contents: read
concurrency:
  group: orivyn-portable-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  portable:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: '6.1.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Record toolchain identities
        run: |
          mkdir -p "$RUNNER_TEMP/orivyn-toolchain"
          swift --version > "$RUNNER_TEMP/orivyn-toolchain/swift.txt"
          node --version > "$RUNNER_TEMP/orivyn-toolchain/node.txt"
          pkg-config --modversion sqlite3 > "$RUNNER_TEMP/orivyn-toolchain/sqlite.txt"
      - name: Verify portable production code
        run: python3 -B scripts/run_portable_checks.py --swift "$(command -v swift)" --output "$RUNNER_TEMP/orivyn-portable"
      - name: Verify production persistence
        if: always()
        run: python3 -B scripts/run_system_sqlite_tests.py --swift "$(command -v swift)" --sqlite-header /usr/include/sqlite3.h --sqlite-library "$(pkg-config --variable=libdir sqlite3)/libsqlite3.so" --output "$RUNNER_TEMP/orivyn-persistence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/orivyn-portable
            ${{ runner.temp }}/orivyn-persistence
            ${{ runner.temp }}/orivyn-toolchain
          retention-days: 1
          if-no-files-found: warn
