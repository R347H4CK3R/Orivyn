name: Cancel explicitly approved superseded runs
on:
  push:
    branches: [codex/cancel-approved-runs-20261115]
    paths: ['.github/workflows/cancel-approved-runs.yml']
permissions:
  actions: write
jobs:
  cancel-approved:
    if: github.repository == 'R347H4CK3R/Orivyn' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the two newly user-approved run identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = "R347H4CK3R/Orivyn"
          allow = {"43653937642":"277ec3af7e8ae5df8d54231b2f3a559bfdddce5c","43657509220":"b9ce34fa68c4b98d09f732cd896e61500b8cc7c9"}
          base = "https://api.github.com/repos/" + repo + "/actions/runs/"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          for run_id, expected_sha in allow.items():
              with urllib.request.urlopen(urllib.request.Request(base + run_id, headers=headers), timeout=30) as response:
                  run = json.load(response)
              if run["id"] != int(run_id) or run["repository"]["full_name"] != repo or run["head_branch"] != "codex/complete-capabilities-20261114" or run["head_sha"] != expected_sha:
                  raise SystemExit("Identity mismatch; refusing cancellation: " + run_id)
              if run["status"] == "completed":
                  print(json.dumps({"id":run["id"],"action":"already completed","conclusion":run["conclusion"]}), flush=True)
                  continue
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + run_id + "/cancel", data=b"", headers=headers, method="POST"), timeout=30) as response:
                      if response.status != 202: raise SystemExit("Unexpected cancellation response")
                  print(json.dumps({"id":run["id"],"action":"cancellation requested"}), flush=True)
              except urllib.error.HTTPError as error:
                  if error.code != 409: raise
                  with urllib.request.urlopen(urllib.request.Request(base + run_id, headers=headers), timeout=30) as response:
                      latest=json.load(response)
                  if latest["status"] != "completed": raise SystemExit("Cancellation rejected for active approved run: " + run_id)
                  print(json.dumps({"id":run["id"],"action":"completed during cancellation","conclusion":latest["conclusion"]}), flush=True)
          
          PY
