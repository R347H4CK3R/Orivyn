name: Publish verified Orivyn build 20 preview
on:
  push:
    branches: [fix/build20-import-crash]
    paths: ['.github/workflows/publish-build20.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2
          persist-credentials: false
      - name: Require exact native and package success
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/44020819713 > run.json
          gh api repos/$GH_REPO/actions/runs/44020819713/jobs > jobs.json
          python3 - <<'PYGATE'
          import json
          r=json.load(open('run.json'))
          assert r['head_sha']=='a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2' and r['conclusion']=='success'
          jobs=json.load(open('jobs.json'))['jobs']
          assert len(jobs)==1 and jobs[0]['conclusion']=='success'
          for expected in ['Build and verify combined runtime','Verify bounded archive resource usage in fresh native processes','Actual ZIP picker, reviewed restore and persistent history','Package build 20 only after exact native acceptance passes']:
              steps=[s for s in jobs[0]['steps'] if s['name']==expected]
              assert len(steps)==1 and steps[0]['conclusion']=='success'
          PYGATE
      - name: Verify exact downloadable candidate
        run: |
          set -euo pipefail
          gh run download 44020819713 --name Orivyn-archive-restore-evidence --dir candidate
          python3 - <<'PYVERIFY'
          import pathlib,json,subprocess,hashlib
          root=pathlib.Path('candidate')
          paths=list(root.rglob('*.ipa')); assert len(paths)==1
          ipa=paths[0]
          subprocess.run(['python3','scripts/verify_ipa.py',str(ipa),'--output','verified-ipa.json'],check=True)
          v=json.load(open('verified-ipa.json'))
          assert (v['build'],v['version'],v['bundle_identifier'])==('20','0.1.4','app.jarvisevo.ios')
          assert v['sha256']=='6424d9d4e8acadf8e131285e0165f82359f472364e35094fe1ae3464d53f85a0' and v['size']==37901272
          assert v==json.load(open(ipa.parent/'ipa-verification.json'))
          scope=json.load(open(ipa.parent/'SCOPE.json'))
          assert scope['source_commit']=='a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2'
          assert scope['device_build']=='passed' and scope['ipa_structure_check']=='passed'
          assert scope['native_features']==['ORIVYN_NATIVE_VISION','ORIVYN_NATIVE_TOOLS','ORIVYN_NATIVE_TRANSCRIPT']
          assert not (ipa.parent/'source-status-before.txt').read_text().strip()
          assert (ipa.parent/'SHA256SUMS').read_text().strip()==v['sha256']+'  '+ipa.name
          summaries=list(root.glob('archive-restore/summary.json')); assert len(summaries)==1
          summary=json.load(open(summaries[0]))
          for k,n in {'totalTestCount':265,'passedTests':265,'failedTests':0,'skippedTests':0}.items(): assert summary[k]==n
          expected_cases={'preservation-resource':{'complete-33554432','complete-2200000000','cancel-33554432'},'import-resource':{'dense','many','longstream','malformed','opaque-limit'}}
          for label,cases in expected_cases.items():
              result=json.load(open(root/label/'RESULT.json'))
              assert result['compileExit']==0 and set(result['cases'])==cases and all(value==0 for value in result['cases'].values())
              for entry in json.load(open(root/label/'SOURCE-MANIFEST.json')):
                  assert hashlib.sha256(pathlib.Path(entry['source']).read_bytes()).hexdigest()==entry['sha256']
          pathlib.Path('ipa-path.txt').write_text(str(ipa))
          PYVERIFY
      - name: Recheck live version before publication
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/R347H4CK3R/Orivyn-Distribution/main/source.json -o current-source.json
          python3 scripts/release_version_guard.py --project project.yml --source current-source.json --ipa "$(cat ipa-path.txt)"
      - name: Publish unfinished preview without replacing older releases
        run: |
          set -euo pipefail
          IPA="$(cat ipa-path.txt)"
          sha256sum "$IPA" | sed 's|  .*/|  |' > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Orivyn 0.1.4 build 20 — unfinished unsigned iOS 26+ preview.
          
          Changes: large ZIP copy/verification and record streaming release Foundation read temporaries per chunk. Display progress uses one bounded mailbox instead of a task per callback. Selected-field JSON projection validates but skips unused metadata without constructing its full object graph, preserving privacy/visibility rules and reviewed restore semantics. Low-storage and processing-limit errors explain recovery. Existing originals and history are preserved. No video downloading, broader autonomy, vision or sync is added.
          
          Verification: exact-source iPhone 16 Plus / iOS 26.1 Simulator gate passed all 265 selected tests with zero failures/skips, including dense synthetic ZIP preservation, review and transactional commit with existing-history retention, malformed archive rejection and existing actual-model chat regressions. Fresh macOS probes verified 2.2 GB copy/revalidation at 4,571,136 bytes peak RSS, dense 15.9 MB unused metadata at 45,268,992 bytes, and approximately 503 MB record streaming at 5,357,568 bytes. Cancellation retains the partial archive without treating it as verified. Combined runtime and Release device build/IPA structure checks passed on the same source. Packaging SCOPE says native tests not_run for that separate packaging step; the preceding simulator step ran independently. These synthetic resource defects are reproduced and mitigated, not a confirmed diagnosis of every app exit or a physical-device memory guarantee.
          
          Limits remain: the user's full private backup and its attachment associations have not been accepted end to end. Unsupported data must remain explicitly reported; synthetic ZIP tests do not establish every exported asset can be restored. This is not general ChatGPT parity or unrestricted autonomous execution. Plugin suggestions do not execute automatically. Physical iPhone installation, signing refresh, thermal/resource behavior, voice and broad app acceptance remain unverified. Some broader vision and live-sync capabilities remain unfinished. Models download separately; no weights are bundled. Optional remote providers may charge.
          
          Preserve existing app data and signing identity when updating. SideStore or another compatible installer must sign this unsigned IPA. Earlier builds remain available. Not completed 1.0.0 and not an OpenAI product.
          
          Exact source: a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2
          Gate: https://github.com/R347H4CK3R/Orivyn/actions/runs/44020819713
          IPA: Orivyn-0.1.4-build20-unsigned.ipa
          Bytes: 37901272
          SHA-256: 6424d9d4e8acadf8e131285e0165f82359f472364e35094fe1ae3464d53f85a0
          NOTES
          gh api --method POST repos/$GH_REPO/git/refs -f ref=refs/tags/orivyn-v0.1.4-build20 -f sha=a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2 > created-tag.json
          python3 - <<'PYTAG'
          import json
          t=json.load(open('created-tag.json'))
          assert t['ref']=='refs/tags/orivyn-v0.1.4-build20'
          assert t['object']['type']=='commit' and t['object']['sha']=='a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2'
          PYTAG
          gh release create orivyn-v0.1.4-build20 --verify-tag "$IPA" SHA256SUMS verified-ipa.json --target a5888697d79c9d3ca2264ec2e0a4f051cef3c0e2 --title "Orivyn 0.1.4 build 20 - unfinished preview" --notes-file release-notes.md --prerelease
