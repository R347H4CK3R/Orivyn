name: Validate Orivyn native capabilities
on:
  workflow_dispatch:
  push:
    branches: [codex/complete-capabilities-20261114]
    paths:
      - 'JarvisEVO/**'
      - 'Tests/**'
      - 'Diagnostics/CombinedRuntime/**'
      - 'Diagnostics/NativeTools/**'
      - 'Diagnostics/VisionProof/Bridge/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
concurrency:
  group: orivyn-native-capabilities
  cancel-in-progress: false
jobs:
  native:
    # Standard GitHub-hosted macOS is free for public repositories. Never consume
    # private allowance or larger/paid runners if visibility changes again.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ORIVYN_NATIVE_FEATURES: 'ORIVYN_NATIVE_VISION ORIVYN_NATIVE_TOOLS'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Build and verify combined native runtime
        run: bash scripts/ci_combined_runtime.sh
      - name: Test enabled app and package unsigned development candidate
        run: bash scripts/ci_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orivyn-native-capability-evidence
          path: artifacts
          retention-days: 1
          if-no-files-found: warn
