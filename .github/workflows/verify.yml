name: Validate Jarvis-EVO candidate
# Manual only: private-repository free allowance must be verified before dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-evo-candidate
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Test and package unsigned candidate
        run: bash scripts/ci_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jarvis-EVO-candidate-evidence
          path: artifacts
          retention-days: 3
          if-no-files-found: warn
