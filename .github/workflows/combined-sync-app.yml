name: Validate integrated foreground sync app candidate
on:
  push:
    branches: [codex/combined-sync-app-20261115]
    paths: ['JarvisEVO/**', 'Tests/**', 'scripts/ci_combined_peer_history.sh', '.github/workflows/combined-sync-app.yml']
permissions:
  contents: read
jobs:
  integrated:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Compile actual device and simulator app with sync enabled
        run: bash scripts/ci_peer_app.sh
      - name: Run nineteen actual history and session checks
        run: bash scripts/ci_combined_peer_history.sh
      - name: Verify authenticated exchange including idle and busy scheduling
        if: always()
        run: bash Diagnostics/PeerAuthentication/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-sync-app-${{ github.sha }}
          path: artifacts
          retention-days: 3
          if-no-files-found: error
