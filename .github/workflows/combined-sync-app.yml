name: Validate integrated foreground sync app candidate
on:
  push:
    branches: [codex/combined-sync-app-20261115]
    paths: ['JarvisEVO/**', 'Tests/**', 'scripts/ci_combined_peer_history.sh', '.github/workflows/combined-sync-app.yml']
permissions:
  contents: read
jobs:
  integrated:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Compile actual device and simulator app with sync enabled
        run: bash scripts/ci_peer_app.sh
      - name: Run twenty-two signed simulator history and session checks
        run: bash scripts/ci_combined_peer_history.sh
      - name: Verify authenticated exchange including idle and busy scheduling
        if: always()
        run: |
          bash Diagnostics/PeerAuthentication/run.sh artifacts/peer-authentication
          python3 scripts/validate_peer_native_evidence.py artifacts/peer-authentication
      - name: Verify real Keychain storage and provisioned TLS identities
        if: always()
        run: |
          bash Diagnostics/PeerProvisioning/run.sh
          python3 - <<'PY'
          import os,pathlib,re
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'peer-provisioning-tests.log').read_text()
          assert re.search(r'Executed 4 tests, with 0 failures',text),text[-4000:]
          PY
      - name: Preserve provisioning diagnostics
        if: always()
        run: |
          mkdir -p artifacts/peer-provisioning
          for log in "$RUNNER_TEMP"/peer-provisioning-*.log; do
            if [[ -f "$log" ]]; then cp "$log" artifacts/peer-provisioning/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-sync-app-${{ github.sha }}
          path: artifacts
          retention-days: 3
          if-no-files-found: error
