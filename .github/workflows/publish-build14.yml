name: Publish verified Orivyn build 14 preview
on:
  push:
    branches: [codex/publish-build14-20261115]
    paths: ['.github/workflows/publish-build14.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 903a3e350da936b4d7f45a9ce82bce537eedfd4f
          persist-credentials: false
      - name: Require exact successful package and host checks
        run: |
          gh api repos/$GH_REPO/actions/runs/43743941500 > package-run.json
          gh api repos/$GH_REPO/actions/runs/43743941500/jobs > package-jobs.json
          python3 - <<'PYGATE'
          import json
          r=json.load(open('package-run.json'))
          assert r['head_sha']=='903a3e350da936b4d7f45a9ce82bce537eedfd4f' and r['conclusion']=='success'
          jobs=json.load(open('package-jobs.json'))['jobs']
          assert len(jobs)==1 and jobs[0]['name']=='candidate' and jobs[0]['conclusion']=='success'
          for expected in ['Run exact production recovery filesystem tests on Darwin','Build and verify combined native runtime','Portable package and graph regressions','Release device build and actual IPA resource validation']:
              steps=[s for s in jobs[0]['steps'] if s['name']==expected]
              assert len(steps)==1 and steps[0]['conclusion']=='success'
          PYGATE
      - name: Retrieve and verify exact package
        run: |
          gh run download 43743941500 --name Orivyn-build14-package-evidence --dir candidate
          python3 - <<'PY'
          import pathlib,subprocess,json
          paths=list(pathlib.Path('candidate').rglob('*.ipa'))
          assert len(paths)==1,paths
          subprocess.run(['python3','scripts/verify_ipa.py',str(paths[0]),'--output','verified-ipa.json'],check=True)
          v=json.load(open('verified-ipa.json'))
          assert v['build']=='14' and v['version']=='0.1.1' and v['bundle_identifier']=='app.jarvisevo.ios'
          assert v['sha256']=='cc4a80128cc5401639c1b1262e43e950aba80974f5b52d0d2906b9eea27b804e' and v['size']==37173985
          expected=json.load(open(paths[0].parent/'ipa-verification.json'))
          assert v==expected
          scope=json.load(open(paths[0].parent/'SCOPE.json'))
          assert scope['source_commit']=='903a3e350da936b4d7f45a9ce82bce537eedfd4f'
          assert scope['device_build']=='passed' and scope['ipa_structure_check']=='passed'
          assert scope['native_features']==['ORIVYN_NATIVE_VISION','ORIVYN_NATIVE_TOOLS','ORIVYN_NATIVE_TRANSCRIPT']
          assert not (paths[0].parent/'source-status-before.txt').read_text().strip()
          assert (paths[0].parent/'SHA256SUMS').read_text().strip()==v['sha256']+'  '+paths[0].name
          pathlib.Path('ipa-path.txt').write_text(str(paths[0]))
          PY
      - name: Publish labeled unfinished preview
        run: |
          set -euo pipefail
          IPA="$(cat ipa-path.txt)"
          sha256sum "$IPA" | sed 's|  .*/|  |' > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Orivyn 0.1.1 build 14 — unfinished unsigned iOS 26+ preview.

          Makes reviewed conversation plans the primary recommended task entry point. Generic task creation remains behind an explicitly labeled experimental disclosure; existing generic records display a no-completion-checklist warning. The disclosure accessibility identifier is scoped to its label so the Create control remains independently accessible. Existing tasks are preserved, and no task starts automatically.

          Retains build13's conservative model-install recovery, build12's orphan model-snapshot recovery and active leases, and build11's confirmation before replacing history. Preserve-local remains the backup default. Native tools, experimental vision and transcript features remain enabled.

          Verification: exact build14 Release iOS device compilation and unsigned IPA/resource verification, combined runtime compilation, 19 synthetic Darwin recovery tests with zero failures/skips, and package/graph/discovery contracts. On the same application-source lineage before version/documentation/package-only edits, a targeted ARM64 iPhone16Plus/iOS26.1 Simulator UI test passed creation/disclosure/persistence/relaunch/no-autoexecution assertions; a separate actual Qwen Q4 reviewed-plan test passed proposal, programmatic approval, three native search/read/answer decisions and an unpredictable marker answer. The first UI attempt failed accessibility lookup; the corrected run passed with all original assertions retained. Exact device-package simulator tests were not rerun. These results do not establish physical-device acceptance, UI approval interaction, general autonomy, broad UI coverage, memory-mapped crash durability or external file-provider grants.

          Evidence: https://github.com/R347H4CK3R/Orivyn/actions/runs/43742100593 (targeted UI), https://github.com/R347H4CK3R/Orivyn/actions/runs/43735658643 (reviewed inference). Existing aggregate Python failures remain disclosed; only scoped gates are claimed passing.

          Known limits: general autonomous requests can still answer before completing requested reads. Vision is experimental with an earlier mixed-shape counting failure. Automatic live sync remains disabled. Models download separately; no weights are bundled. Optional remote providers may charge. Existing unmarked orphan snapshots remain untouched. This is not completed 1.0.0 and is not an OpenAI product.

          SideStore or another compatible installer must sign this unsigned IPA. Preserve existing app data and signing identity when updating. Required third-party notices and model license terms remain bundled.

          Exact package source: 903a3e350da936b4d7f45a9ce82bce537eedfd4f
          Successful gate: https://github.com/R347H4CK3R/Orivyn/actions/runs/43743941500
          File: Orivyn-0.1.1-build14-unsigned.ipa
          Size: 37173985 bytes
          SHA-256: cc4a80128cc5401639c1b1262e43e950aba80974f5b52d0d2906b9eea27b804e
          NOTES
          # Create an exact lightweight tag atomically; fail if another tag already exists.
          gh api --method POST repos/$GH_REPO/git/refs -f ref=refs/tags/orivyn-v0.1.1-build14 -f sha=903a3e350da936b4d7f45a9ce82bce537eedfd4f > created-tag.json
          python3 - <<'PYTAG'
          import json
          tag=json.load(open('created-tag.json'))
          assert tag['ref']=='refs/tags/orivyn-v0.1.1-build14'
          assert tag['object']['type']=='commit' and tag['object']['sha']=='903a3e350da936b4d7f45a9ce82bce537eedfd4f'
          PYTAG
          gh release create orivyn-v0.1.1-build14 --verify-tag "$IPA" SHA256SUMS verified-ipa.json --target 903a3e350da936b4d7f45a9ce82bce537eedfd4f --title "Orivyn 0.1.1 build 14 — unfinished preview" --notes-file release-notes.md --prerelease
