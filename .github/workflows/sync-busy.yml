name: Authenticated busy packet regression
on:
  push:
    branches: [codex/authenticated-sync-busy-20261115]
    paths:
      - 'JarvisEVO/Core/TextRevisionPacket.swift'
      - 'Tests/TextRevisionPacketTests.swift'
      - '.github/workflows/sync-busy.yml'
permissions:
  contents: read
jobs:
  persistence:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: '6.1.3'
      - name: Install SQLite development inputs
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Run production packet and persistence tests
        run: python3 -B scripts/run_system_sqlite_tests.py --swift "$(command -v swift)" --sqlite-header /usr/include/sqlite3.h --sqlite-library "$(pkg-config --variable=libdir sqlite3)/libsqlite3.so" --output "$RUNNER_TEMP/sync-busy-tests"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-busy-portable-evidence
          path: ${{ runner.temp }}/sync-busy-tests/*.log
          retention-days: 7
