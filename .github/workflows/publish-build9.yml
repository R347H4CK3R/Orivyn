name: Publish verified Orivyn build 9 preview
on:
  push:
    branches: [codex/publish-build9-20261115]
    paths: ['.github/workflows/publish-build9.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32ddf39174ce7afe0b026f26380b5b0d6ad66a04
          persist-credentials: false
      - name: Require exact successful core job
        run: |
          gh api repos/$GH_REPO/actions/runs/43679464506 > run.json
          gh api repos/$GH_REPO/actions/runs/43679464506/jobs > jobs.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json'))
          assert r['head_sha']=='32ddf39174ce7afe0b026f26380b5b0d6ad66a04'
          jobs=[j for j in json.load(open('jobs.json'))['jobs'] if j['name']=='native (core)']
          assert len(jobs)==1 and jobs[0]['status']=='completed' and jobs[0]['conclusion']=='success'
          PY
      - name: Retrieve and verify exact package
        run: |
          gh run download 43679464506 --name Orivyn-native-capability-evidence-core --dir candidate
          python3 - <<'PY'
          import pathlib, subprocess, json
          paths=list(pathlib.Path('candidate').rglob('*.ipa'))
          assert len(paths)==1, paths
          subprocess.run(['python3','scripts/verify_ipa.py',str(paths[0]),'--output','verified-ipa.json'],check=True)
          v=json.load(open('verified-ipa.json'))
          assert v['build']=='9' and v['version']=='0.1.1' and v['bundle_identifier']=='app.jarvisevo.ios'
          assert v['sha256']=='0b4baf9761ea721959c97f0948b0e0aacd1f64f469d543fae36fe2c745d1fc45' and v['size']==41853828
          pathlib.Path('ipa-path.txt').write_text(str(paths[0]))
          PY
      - name: Publish labeled unfinished preview
        run: |
          set -euo pipefail
          IPA="$(cat ipa-path.txt)"
          sha256sum "$IPA" | sed 's|  .*/|  |' > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Orivyn 0.1.1 build 9 — unfinished unsigned iOS 26+ preview.
          
          Includes the verified history receive/recovery boundary and development changes since build 8. Unsaved local history is protected before a peer receive; durable commits are reconciled even after cancellation or lost acknowledgment. Automatic live sync is still disabled: pairing, scheduler and app integration under development are not included.
          
          General autonomy and broad vision remain unreliable. Known intermittent Files presentation and conversation-navigation issues remain. Models download separately. For this exact source, 1,032 native core tests executed with 5 skipped and zero failures; unsigned device build/package checks passed. UI-0 passed, while UI-2 failed waiting for a hittable Files Cancel control after Photos cancellation. The generic production agent failed its required search/read grounded-answer test. These failures are preserved; this is not full acceptance. New experimental engine, vision-model and live sync improvements are NOT included. Physical-device installation, signing refresh, memory/thermal behavior and runtime remain unverified.
          
          Source: 32ddf39174ce7afe0b026f26380b5b0d6ad66a04
          Verification: https://github.com/R347H4CK3R/Orivyn/actions/runs/43679464506
          This is not completed 1.0.0. SideStore or another installer must sign the IPA.
          NOTES
          gh release create orivyn-v0.1.1-build9 "$IPA" SHA256SUMS verified-ipa.json --target 32ddf39174ce7afe0b026f26380b5b0d6ad66a04 --title "Orivyn 0.1.1 build 9 — unfinished preview" --notes-file release-notes.md --prerelease
