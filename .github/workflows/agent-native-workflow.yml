name: Evaluate native transcript read workflows
on:
  push:
    branches: [codex/agent-native-workflow-20261115]
    paths: ['Diagnostics/AgentNativeTranscript/**', '.github/workflows/agent-native-workflow.yml']
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned CPU inference CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-tool-transcript
          git rev-parse HEAD > artifacts/native-tool-transcript/app-source.txt
          git init "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama" fetch --depth 1 origin 2496f9c14965c39589f53eea31bdb6d762b1d360
          git -C "$RUNNER_TEMP/llama" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama" rev-parse HEAD)" = 2496f9c14965c39589f53eea31bdb6d762b1d360
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/llama/build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_BUILD_TESTS=OFF > artifacts/native-tool-transcript/configure.log 2>&1
          cmake --build "$RUNNER_TEMP/llama/build" --target llama-completion -j 2 > artifacts/native-tool-transcript/build.log 2>&1
          echo "LLAMA_SOURCE=$RUNNER_TEMP/llama" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 jinja2==3.1.6
          echo "DIAGNOSTIC_CLI=$RUNNER_TEMP/llama/build/bin/llama-completion" >> "$GITHUB_ENV"
      - name: Download and verify pinned Q4 model
        run: |
          python3 Diagnostics/NativeTools/download.py --model-id qwen3-1.7b-q4_k_m --output "$RUNNER_TEMP/Qwen3-1.7B-Q4_K_M.gguf"
          echo "DIAGNOSTIC_MODEL=$RUNNER_TEMP/Qwen3-1.7B-Q4_K_M.gguf" >> "$GITHUB_ENV"
      - name: Run complete bounded fixture workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 -u Diagnostics/AgentNativeTranscript/workflow.py 2>&1 | tee artifacts/native-tool-transcript/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-native-transcript-${{ github.sha }}
          path: artifacts/native-tool-transcript
          retention-days: 7
