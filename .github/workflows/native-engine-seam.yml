name: Verify experimental production engine native seam
on:
  push:
    branches: [codex/native-engine-seam-20261115]
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: '6.1.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual Swift adapter CLI
        run: |
          echo "EVIDENCE_DIR=$RUNNER_TEMP/swift-native-evaluation" >> "$GITHUB_ENV"
          python3 Diagnostics/NativeTranscriptEvaluation/build_cli.py "$RUNNER_TEMP/swift-native-evaluation"
      - name: Build pinned CPU completion and tokenizer
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama" fetch --depth 1 origin 2496f9c14965c39589f53eea31bdb6d762b1d360
          git -C "$RUNNER_TEMP/llama" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama" rev-parse HEAD)" = 2496f9c14965c39589f53eea31bdb6d762b1d360
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 PyYAML==6.0.2 tqdm==4.67.1 requests==2.32.3
          PYTHONPATH="$RUNNER_TEMP/llama/gguf-py" python3 -c "from gguf import GGUFReader"
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/llama/build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_BUILD_TESTS=OFF > "$EVIDENCE_DIR/configure.log" 2>&1
          cmake --build "$RUNNER_TEMP/llama/build" --target llama-completion llama-tokenize -j 2 > "$EVIDENCE_DIR/build.log" 2>&1
          echo "LLAMA_SOURCE=$RUNNER_TEMP/llama" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_CLI=$RUNNER_TEMP/llama/build/bin/llama-completion" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_TOKENIZER=$RUNNER_TEMP/llama/build/bin/llama-tokenize" >> "$GITHUB_ENV"
      - name: Download and verify pinned Q4 model
        run: |
          python3 Diagnostics/NativeTools/download.py --model-id qwen3-1.7b-q4_k_m --output "$RUNNER_TEMP/Qwen3-1.7B-Q4_K_M.gguf"
          echo "DIAGNOSTIC_MODEL=$RUNNER_TEMP/Qwen3-1.7B-Q4_K_M.gguf" >> "$GITHUB_ENV"
      - name: Compile exact production engine with pinned Swift Crypto
        run: |
          python3 Diagnostics/NativeTranscriptEvaluation/build_engine.py "$RUNNER_TEMP/native-engine"
          echo "NATIVE_ENGINE_CLI=$RUNNER_TEMP/native-engine/native-engine-cli" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/llama/build/bin" >> "$GITHUB_ENV"
      - name: Actual engine rejection and ordinary chat probes
        run: python3 Diagnostics/NativeTranscriptEvaluation/probe_engine.py
      - name: Evaluate real model through actual Swift and reducer
        shell: bash
        run: |
          set -euo pipefail
          python3 -u Diagnostics/NativeTranscriptEvaluation/evaluate_engine.py 2>&1 | tee "$EVIDENCE_DIR/evaluate.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-native-evaluation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/swift-native-evaluation
            ${{ runner.temp }}/native-engine/compile.log
            ${{ runner.temp }}/native-engine/source-manifest.json
            ${{ runner.temp }}/native-engine/Package.swift
            ${{ runner.temp }}/native-engine/Package.resolved
          retention-days: 7
