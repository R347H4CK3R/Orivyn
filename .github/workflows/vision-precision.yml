name: Evaluate vision Q8 precision with frozen cases
on:
  push:
    branches: [codex/vision-precision-20261115]
    paths: ['Diagnostics/VisionPrecision/**', '.github/workflows/vision-precision.yml']
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact-source existing vision bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vision-precision
          git rev-parse HEAD > artifacts/vision-precision/app-source.txt
          git init "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama" fetch --depth 1 origin 2496f9c14965c39589f53eea31bdb6d762b1d360
          git -C "$RUNNER_TEMP/llama" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama" rev-parse HEAD)" = 2496f9c14965c39589f53eea31bdb6d762b1d360
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/llama/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF > artifacts/vision-precision/configure.log 2>&1
          cmake --build "$RUNNER_TEMP/llama/build" --target mtmd -j 2 > artifacts/vision-precision/build.log 2>&1
          bash Diagnostics/VisionProof/Linux/build.sh "$RUNNER_TEMP/llama" "$RUNNER_TEMP/llama/build" "$RUNNER_TEMP/vision.so" > artifacts/vision-precision/bridge-build.log 2>&1
          sha256sum Diagnostics/VisionProof/Bridge/vision_bridge.cpp Diagnostics/VisionProof/QualityV1/{run.py,score.py,FROZEN_CASES.json,fixtures.py} "$RUNNER_TEMP/vision.so" > artifacts/vision-precision/SOURCE_HASHES.txt
      - name: Download pinned candidate pair
        run: python3 Diagnostics/VisionPrecision/download.py "$RUNNER_TEMP/vision-model"
      - name: Execute every unchanged frozen case
        shell: bash
        run: |
          set -euo pipefail
          cp Diagnostics/VisionPrecision/MODEL_PAIR.json artifacts/vision-precision/
          python3 -u Diagnostics/VisionProof/QualityV1/run.py "$RUNNER_TEMP/vision.so" "$RUNNER_TEMP/vision-model" artifacts/vision-precision/results.json 2>&1 | tee artifacts/vision-precision/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-precision-${{ github.sha }}
          path: artifacts/vision-precision
          retention-days: 7
