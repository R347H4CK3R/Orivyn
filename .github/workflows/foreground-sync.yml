name: Foreground sync coordinator
on:
  push:
    branches: [codex/foreground-sync-scheduler-20261115, codex/foreground-sync-idle-fix-20261115]
    paths:
      - 'JarvisEVO/Core/ForegroundSyncCoordinator.swift'
      - 'Diagnostics/ForegroundSync/**'
      - '.github/workflows/foreground-sync.yml'
permissions:
  contents: read
jobs:
  scheduler:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: '6.1.3'
      - name: Compile and execute production scheduler with injected clock and transport
        run: |
          set -o pipefail
          swift --version
          swiftc -swift-version 6 -strict-concurrency=complete -warnings-as-errors JarvisEVO/Core/ForegroundSyncCoordinator.swift Diagnostics/ForegroundSync/Checks.swift -o "$RUNNER_TEMP/sync-checks"
          timeout 30 "$RUNNER_TEMP/sync-checks" | tee "$RUNNER_TEMP/sync-checks.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreground-sync-evidence
          path: ${{ runner.temp }}/sync-checks.log
          retention-days: 7
