name: Pairing approval policy
on:
  push:
    branches: [codex/peer-pairing-approval-20261115]
    paths: ['JarvisEVO/Core/PeerPairingApproval.swift', 'Tests/PeerPairingApprovalTests.swift', '.github/workflows/pairing-policy.yml']
permissions:
  contents: read
jobs:
  policy:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute standalone policy tests
        run: |
          mkdir -p "$RUNNER_TEMP/pairing/Sources/PairingPolicy" "$RUNNER_TEMP/pairing/Tests/PairingPolicyTests"
          cp JarvisEVO/Core/PeerPairingApproval.swift "$RUNNER_TEMP/pairing/Sources/PairingPolicy/"
          cp Tests/PeerPairingApprovalTests.swift "$RUNNER_TEMP/pairing/Tests/PairingPolicyTests/"
          cat > "$RUNNER_TEMP/pairing/Package.swift" <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(name: "PairingPolicy", targets: [.target(name: "PairingPolicy"), .testTarget(name: "PairingPolicyTests", dependencies: ["PairingPolicy"])])
          EOF
          set -o pipefail
          swift test --package-path "$RUNNER_TEMP/pairing" 2>&1 | tee "$RUNNER_TEMP/pairing-policy.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-policy-${{ github.sha }}
          path: ${{ runner.temp }}/pairing-policy.log
          retention-days: 7
