name: Package current Orivyn build 8
on:
  workflow_dispatch:
  push:
    branches: [codex/package-build8-20261115]
    paths: ['.github/workflows/package-build8.yml', 'project.yml']
permissions:
  contents: read
concurrency:
  group: orivyn-package8-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  package-iphone:
    # Standard GitHub-hosted macOS is free for public repositories. Never consume
    # private allowance or larger/paid runners if visibility changes again.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      ORIVYN_NATIVE_FEATURES: 'ORIVYN_NATIVE_VISION ORIVYN_NATIVE_TOOLS'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        id: xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "identity=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: combined-cache
        with:
          path: .cache/orivyn-combined
          # This exact-source/compiler cache contains both arm64 and x86_64 simulator slices.
          # Verify SHA, Mach-O architectures, platforms, headers and symbols before use.
          key: combined-v1-macOS-ARM64-${{ steps.xcode.outputs.identity }}-${{ hashFiles('Diagnostics/CombinedRuntime/prepare_build.py', 'Diagnostics/CombinedRuntime/simulator-slices.sh', 'Diagnostics/CombinedRuntime/build-ios-combined.sh', 'Diagnostics/CombinedRuntime/native-bridges.cmake', 'Diagnostics/VisionRuntime/prepare_build.py', 'Diagnostics/VisionRuntime/source/build-xcframework.sh', 'Diagnostics/NativeTools/*.cpp', 'Diagnostics/NativeTools/*.h', 'Diagnostics/VisionProof/Bridge/*.cpp', 'Diagnostics/VisionProof/Bridge/*.h', 'scripts/verify_combined_runtime.py', 'scripts/ci_combined_runtime.sh') }}
      - name: Build and verify combined native runtime
        run: bash scripts/ci_combined_runtime.sh
      - name: Build and inspect current unsigned iPhone package
        run: bash scripts/ci_package_only.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orivyn-build8-package-${{ github.sha }}
          path: artifacts
          retention-days: 1
          if-no-files-found: warn
