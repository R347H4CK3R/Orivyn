name: Verify build 20 bounded archive import resources
on:
  push:
    branches: [fix/build20-import-crash]
    paths: ['.github/workflows/archive-restore.yml']
permissions:
  contents: read
concurrency:
  group: archive-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-archive-restore:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ORIVYN_NATIVE_FEATURES: 'ORIVYN_NATIVE_VISION ORIVYN_NATIVE_TOOLS ORIVYN_NATIVE_TRANSCRIPT'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release metadata enforcement
        run: |
          python3 -m unittest discover -s scripts/tests -p test_release_version_guard.py -v
          python3 -m unittest discover -s scripts/tests -p test_release_info.py -v
      - name: Select Xcode 26.1
        id: xcode
        run: |
          test -d /Applications/Xcode_26.1.app
          sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer
          echo "identity=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: combined-cache
        with:
          path: .cache/orivyn-combined
          key: combined-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.identity }}-${{ hashFiles('Diagnostics/CombinedRuntime/prepare_build.py', 'Diagnostics/CombinedRuntime/simulator-slices.sh', 'Diagnostics/CombinedRuntime/build-ios-combined.sh', 'Diagnostics/CombinedRuntime/native-bridges.cmake', 'Diagnostics/VisionRuntime/prepare_build.py', 'Diagnostics/VisionRuntime/source/build-xcframework.sh', 'Diagnostics/NativeTools/*.cpp', 'Diagnostics/NativeTools/*.h', 'Diagnostics/VisionProof/Bridge/*.cpp', 'Diagnostics/VisionProof/Bridge/*.h', 'scripts/verify_combined_runtime.py', 'scripts/ci_combined_runtime.sh') }}
      - name: Build and verify combined runtime
        run: bash scripts/ci_combined_runtime.sh
      - uses: actions/cache/save@v4
        if: steps.combined-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/orivyn-combined
          key: ${{ steps.combined-cache.outputs.cache-primary-key }}
      - name: Verify bounded archive resource usage in fresh native processes
        run: |
          set +e
          python3 scripts/run_preservation_resource_probe.py --swiftc "$(xcrun -f swiftc)" --output "$RUNNER_TEMP/preservation-resource"
          PRESERVE=$?
          python3 scripts/run_import_resource_probe.py --swiftc "$(xcrun -f swiftc)" --output "$RUNNER_TEMP/import-resource"
          PARSE=$?
          python3 - <<'PYEVIDENCE'
          import os,pathlib,shutil
          for label in ['preservation-resource','import-resource']:
              source=pathlib.Path(os.environ['RUNNER_TEMP'])/label
              target=pathlib.Path('artifacts')/label;target.mkdir(parents=True,exist_ok=True)
              for path in source.glob('*'):
                  if path.is_file() and (path.suffix in ['.log','.swift','.txt'] or path.name in ['RESULT.json','SOURCE-MANIFEST.json','COMMAND.json','FIXTURES.json']): shutil.copy2(path,target/path.name)
          PYEVIDENCE
          EVIDENCE=$?
          test "$PRESERVE" = 0 && test "$PARSE" = 0 && test "$EVIDENCE" = 0
      - name: Actual ZIP picker, reviewed restore and persistent history
        run: bash scripts/ci_archive_restore.sh
      - name: Package build 20 only after exact native acceptance passes
        run: bash scripts/ci_package_only.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orivyn-archive-restore-evidence
          path: artifacts
          retention-days: 7
          if-no-files-found: error
