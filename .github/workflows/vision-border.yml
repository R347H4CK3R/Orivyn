name: Evaluate center preserving crop and expanded holdouts
on:
  push:
    branches: [codex/vision-center-candidate-20261115]
    paths: ['Diagnostics/VisionBorder/**', '.github/workflows/vision-border.yml']
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact-source existing vision bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vision-border
          git rev-parse HEAD > artifacts/vision-border/app-source.txt
          git init "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama" fetch --depth 1 origin 2496f9c14965c39589f53eea31bdb6d762b1d360
          git -C "$RUNNER_TEMP/llama" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama" rev-parse HEAD)" = 2496f9c14965c39589f53eea31bdb6d762b1d360
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/llama/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF > artifacts/vision-border/configure.log 2>&1
          cmake --build "$RUNNER_TEMP/llama/build" --target mtmd -j 2 > artifacts/vision-border/build.log 2>&1
          git fetch --depth 1 origin ebf810d88be3702e3149707058d101a59a746afb
          git show ebf810d88be3702e3149707058d101a59a746afb:Diagnostics/VisionProof/Bridge/vision_bridge.cpp > "$RUNNER_TEMP/base.cpp"
          cp Diagnostics/VisionProof/Bridge/vision_bridge.cpp "$RUNNER_TEMP/candidate.cpp"
          cp "$RUNNER_TEMP/base.cpp" Diagnostics/VisionProof/Bridge/vision_bridge.cpp
          bash Diagnostics/VisionProof/Linux/build.sh "$RUNNER_TEMP/llama" "$RUNNER_TEMP/llama/build" "$RUNNER_TEMP/base.so" > artifacts/vision-border/base-build.log 2>&1
          cp "$RUNNER_TEMP/candidate.cpp" Diagnostics/VisionProof/Bridge/vision_bridge.cpp
          bash Diagnostics/VisionProof/Linux/build.sh "$RUNNER_TEMP/llama" "$RUNNER_TEMP/llama/build" "$RUNNER_TEMP/vision.so" > artifacts/vision-border/bridge-build.log 2>&1
          sha256sum Diagnostics/VisionProof/Bridge/vision_bridge.cpp Diagnostics/VisionProof/QualityV1/{run.py,score.py,FROZEN_CASES.json,fixtures.py} "$RUNNER_TEMP/vision.so" > artifacts/vision-border/SOURCE_HASHES.txt
      - name: Download pinned production pair
        run: python3 Diagnostics/VisionProof/prepare_production_pair.py "$RUNNER_TEMP/vision-model"
      - name: Execute unchanged frozen acceptance and new holdouts for both binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==11.3.0
          export ORIVYN_LLAMA_FIXTURES="$RUNNER_TEMP/llama/tools/server/webui/tests/stories/fixtures/assets"
          python3 Diagnostics/VisionBorder/holdout.py
          cp Diagnostics/VisionProof/Linux/Evidence/production/MODEL_PAIR.json artifacts/vision-border/
          cp Diagnostics/VisionProof/BorderHoldout/FROZEN_CASES.json artifacts/vision-border/HOLDOUT_CASES.json
          set +e
          aggregate=0
          for library in base vision; do
            for suite in QualityV1 BorderHoldout; do
              python3 -u "Diagnostics/VisionProof/$suite/run.py" "$RUNNER_TEMP/$library.so" "$RUNNER_TEMP/vision-model" "artifacts/vision-border/$library-$suite.json" > "artifacts/vision-border/$library-$suite.log" 2>&1
              result=$?
              cat "artifacts/vision-border/$library-$suite.json"
              printf '%s %s exit=%s\n' "$library" "$suite" "$result" | tee -a artifacts/vision-border/outcomes.txt
              if [[ "$result" != 0 ]]; then aggregate=1; fi
            done
          done
          exit "$aggregate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-border-${{ github.sha }}
          path: artifacts/vision-border
          retention-days: 7
