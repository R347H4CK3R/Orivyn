name: Verify Orivyn build 12 snapshot preview
on:
  push:
    branches: [ci/snapshot-build12-20261115]
    paths: ['.github/workflows/snapshot-build12.yml']
permissions:
  contents: read
concurrency:
  group: snapshot-build12
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ORIVYN_NATIVE_FEATURES: 'ORIVYN_NATIVE_VISION ORIVYN_NATIVE_TOOLS ORIVYN_NATIVE_TRANSCRIPT'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        id: xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "identity=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Verify Darwin snapshot files and process termination
        run: |
          set -euo pipefail
          mkdir -p artifacts/snapshot-host
          python3 - <<'PYHOST'
          import hashlib,json,pathlib
          root=pathlib.Path('artifacts/snapshot-host')
          manifest=[]
          for source,dest in [('JarvisEVO/Core/NativeModelSnapshot.swift','Sources/JarvisEVO'),('Tests/NativeModelSnapshotTests.swift','Tests/JarvisEVOTests')]:
              data=pathlib.Path(source).read_bytes();folder=root/dest;folder.mkdir(parents=True,exist_ok=True)
              (folder/pathlib.Path(source).name).write_bytes(data)
              manifest.append({'source':source,'sha256':hashlib.sha256(data).hexdigest()})
          (root/'Package.swift').write_text('// swift-tools-version: 6.0\nimport PackageDescription\nlet package = Package(name: "SnapshotHostProof", platforms:[.macOS(.v14)], targets:[.target(name:"JarvisEVO"),.testTarget(name:"JarvisEVOTests",dependencies:["JarvisEVO"])])\n')
          (root/'SOURCE-MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          PYHOST
          swift test --package-path artifacts/snapshot-host 2>&1 | tee artifacts/snapshot-host-tests.log
          grep -Eq 'Executed 10 tests, with 0 failures' artifacts/snapshot-host-tests.log
          ! grep -Eiq 'skipped|failed' artifacts/snapshot-host-tests.log
          python3 scripts/run_snapshot_process_smoke.py --swiftc "$(xcrun --find swiftc)" --sdk "$(xcrun --sdk macosx --show-sdk-path)" | tee artifacts/snapshot-process.json
          echo 'Host synthetic filesystem/process tests and native-flag device compilation only; not iOS inference, mmap lifetime or physical device acceptance.' > artifacts/SNAPSHOT-SCOPE.txt
      - name: Build and verify combined native runtime
        run: bash scripts/ci_combined_runtime.sh
      - name: Portable package and graph regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_verify_ipa.py'
          python3 -m unittest discover -s scripts/tests -p 'test_generate_project.py'
      - name: Release device build and actual IPA resource validation
        id: package
        run: bash scripts/ci_package_only.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orivyn-build12-package-evidence
          path: artifacts
          retention-days: 7
          if-no-files-found: error
