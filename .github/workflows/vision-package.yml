name: Verify LFM release resource gate
on:
  push:
    branches: [codex/vision-lfm-integration-20261115]
    paths: ['.github/workflows/vision-package.yml']
permissions:
  contents: read
jobs:
  package-validator:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run actual ZIP package validation regressions
        run: python3 -B -m unittest discover -s scripts/tests -p test_verify_ipa.py -v
