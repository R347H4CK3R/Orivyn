name: Verify native selected backup integration
on:
  push:
    branches: [ci/backup-selected-file-20261115]
    paths: ['JarvisEVO/**', 'Tests/**', 'UITests/**', 'scripts/ci_backup_selected_file.sh', '.github/workflows/backup-selected-file.yml']
permissions:
  contents: read
concurrency:
  group: backup-selected-file-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulator:
    # Public-repository standard runner only. Never use private allowance or paid larger runners.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Test sixteen backup state and local file checks
        run: bash scripts/ci_backup_selected_file.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-selected-file-evidence-${{ github.sha }}
          path: artifacts/backup-selected-file
          retention-days: 3
          if-no-files-found: warn
