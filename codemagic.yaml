workflows:
  jarvis-evo-candidate:
    name: Jarvis-EVO iOS candidate verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
    scripts:
      - name: Test and package unsigned iPhone candidate
        script: bash scripts/run_native_tests.sh --run-build artifacts bash scripts/ci_macos.sh
    artifacts:
      - artifacts/*/*.ipa
      - artifacts/*/*-evidence-*.zip
      - artifacts/*/*.log
      - artifacts/*/*.json
      - artifacts/*/*.txt
      - artifacts/*/SHA256SUMS
      - artifacts/*/screenshots/**/*.png
      - artifacts/*/screenshots/**/*.jpg
      - artifacts/*/screenshots/**/*.jpeg
      - artifacts/*/screenshots/**/*.json
      - artifacts/*/screenshots/**/*.txt
      - artifacts/*/Tests.xcresult
# No automatic triggers or publication. Run only after private repository access
# and remaining free build capacity are authorized and verified.
  orivyn-integration-regression:
    name: Orivyn integration regression proof
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
    scripts:
      - name: Focused native integration regression
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          bash scripts/bootstrap_llama.sh
          # Xcode builds the unit-test target even for UI-only selection.
          # Its real-model resource must exist; optional source does not skip Copy Resources.
          python3 scripts/download_test_model.py
          xcodegen generate
          mkdir -p artifacts/integration-regression
          xcrun simctl list devices available -j > artifacts/integration-regression/simulators.json
          SIMULATOR_ID=$(python3 -c 'import json; v=json.load(open("artifacts/integration-regression/simulators.json"))["devices"]; ds=[d for r,items in v.items() if "iOS-26" in r for d in items if "iPhone" in d["name"] and d.get("isAvailable")]; ds.sort(key=lambda d:(d["name"]!="iPhone 16 Plus",d["name"])); print(ds[0]["udid"])')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          bash scripts/run_native_tests.sh artifacts/integration-regression xcodebuild -project JarvisEVO.xcodeproj -scheme JarvisEVO -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -resultBundlePath artifacts/integration-regression/Tests.xcresult -only-testing:JarvisEVOUITests/OrivynIntegrationUITests -only-testing:JarvisEVOTests/IncomingTextTests -only-testing:JarvisEVOTests/ReminderSchedulerTests -only-testing:JarvisEVOTests/AppModelTests CODE_SIGNING_ALLOWED=NO test
    artifacts:
      - artifacts/integration-regression/*.log
      - artifacts/integration-regression/screenshots/**/*.png
      - artifacts/integration-regression/screenshots/**/*.json
      - artifacts/integration-regression/screenshots/**/*.txt
      - artifacts/integration-regression/Tests.xcresult
  orivyn-native-tools-regression:
    name: Orivyn native tools regression proof
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
    scripts:
      - name: Focused native tools regression
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          bash scripts/bootstrap_llama.sh
          # Xcode builds the unit-test target even for UI-only selection.
          # Its real-model resource must exist; optional source does not skip Copy Resources.
          python3 scripts/download_test_model.py
          xcodegen generate
          mkdir -p artifacts/native-tools-regression
          xcrun simctl list devices available -j > artifacts/native-tools-regression/simulators.json
          SIMULATOR_ID=$(python3 -c 'import json; v=json.load(open("artifacts/native-tools-regression/simulators.json"))["devices"]; ds=[d for r,items in v.items() if "iOS-26" in r for d in items if "iPhone" in d["name"] and d.get("isAvailable")]; ds.sort(key=lambda d:(d["name"]!="iPhone 16 Plus",d["name"])); print(ds[0]["udid"])')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          # Real Core Location simulator input, explicitly not physical GPS evidence.
          xcrun simctl location "$SIMULATOR_ID" set 37.3349,-122.0090
          bash scripts/run_native_tests.sh artifacts/native-tools-regression xcodebuild -project JarvisEVO.xcodeproj -scheme JarvisEVO -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -resultBundlePath artifacts/native-tools-regression/Tests.xcresult -only-testing:JarvisEVOUITests/NativeToolsUITests -only-testing:JarvisEVOTests/NativeToolDraftsTests -only-testing:JarvisEVOTests/OneShotLocationTests -only-testing:JarvisEVOUITests/OrivynIntegrationUITests -only-testing:JarvisEVOTests/IncomingTextTests -only-testing:JarvisEVOTests/ReminderSchedulerTests -only-testing:JarvisEVOTests/AppModelTests CODE_SIGNING_ALLOWED=NO test
    artifacts:
      - artifacts/native-tools-regression/*.log
      - artifacts/native-tools-regression/screenshots/**/*.png
      - artifacts/native-tools-regression/screenshots/**/*.json
      - artifacts/native-tools-regression/screenshots/**/*.txt
      - artifacts/native-tools-regression/Tests.xcresult

