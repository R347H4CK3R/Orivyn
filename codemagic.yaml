workflows:
  jarvis-evo-candidate:
    name: Jarvis-EVO iOS candidate verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ci/qa-625f20c-red-3
          include: true
          source: true
      cancel_previous_builds: false
    environment:
      xcode: 26.0
    scripts:
      - name: Test and package unsigned iPhone candidate
        script: bash scripts/ci_macos.sh
    artifacts:
      - artifacts/**
# This isolated branch starts one native verification attempt on its initial push.
# No publication or billing changes. Do not reuse the branch for later attempts.
