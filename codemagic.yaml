workflows:
  jarvis-evo-candidate:
    name: Jarvis-EVO iOS candidate verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ci/qa-d954d20-candidate3-9
          include: true
          source: true
      cancel_previous_builds: false
    environment:
      xcode: 26.0
    scripts:
      - name: Test and package unsigned iPhone candidate
        script: bash scripts/run_native_tests.sh --run-build artifacts bash scripts/ci_macos.sh
    artifacts:
      - artifacts/*/*.ipa
      - artifacts/*/*-evidence-*.zip
      - artifacts/*/*.log
      - artifacts/*/*.json
      - artifacts/*/*.txt
      - artifacts/*/SHA256SUMS
      - artifacts/*/screenshots/**/*.png
      - artifacts/*/screenshots/**/*.jpg
      - artifacts/*/screenshots/**/*.jpeg
      - artifacts/*/screenshots/**/*.json
      - artifacts/*/screenshots/**/*.txt
      - artifacts/*/Tests.xcresult
# This isolated branch starts one full candidate 3 verification attempt.
# No publication or billing changes. Do not reuse for another attempt.
