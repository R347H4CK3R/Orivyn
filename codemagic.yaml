  orivyn-bios-compatibility:
    name: Orivyn bounded native BIOS compatibility
    max_build_duration: 9
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
    scripts:
      - name: Pinned offline engine compatibility
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          mkdir -p artifacts/bios-compatibility
          set +e
          bash Diagnostics/VMProof/run_native.sh 2>&1 | tee artifacts/bios-compatibility/bios.log
          RESULT=${PIPESTATUS[0]}
          set -e
          cp -R Diagnostics/VMProof/artifacts artifacts/bios-compatibility/native
          bash scripts/run_native_tests.sh --bundle-evidence artifacts
          exit "$RESULT"
    artifacts:
      - artifacts/bios-compatibility/**/*.log
      - artifacts/bios-compatibility/**/*.txt
      - artifacts/bios-compatibility/**/*.json
      - artifacts/bios-compatibility/**/*.zip
      - artifacts/bios-compatibility/**/*.xcresult
