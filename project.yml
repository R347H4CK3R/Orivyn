name: JarvisEVO
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_BUNDLE_IDENTIFIER: app.jarvisevo.ios
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 12
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(ORIVYN_NATIVE_FEATURES)"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG $(ORIVYN_NATIVE_FEATURES)"
packages:
  LlamaRuntime:
    path: Packages/LlamaRuntime
targets:
  JarvisEVO:
    type: application
    platform: iOS
    sources:
      - path: JarvisEVO
        excludes: [Resources/VMAssets, Resources/LocalAgentDecision.gbnf]
      - path: JarvisEVO/Resources/LocalAgentDecision.gbnf
        buildPhase: resources
      - path: JarvisEVO/Resources/VMAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: JarvisEVO/Info.plist
        PRODUCT_NAME: JarvisEVO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: JavaScriptCore.framework
      - package: LlamaRuntime
        product: LlamaRuntime
  JarvisEVOTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: .cache/test-models/qwen2.5-0.5b-instruct-q4_k_m.gguf
        buildPhase: resources
        optional: true
    dependencies:
      - target: JarvisEVO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.jarvisevo.tests
  JarvisEVOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: JarvisEVO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.jarvisevo.uitests
schemes:
  JarvisEVO:
    build:
      targets:
        JarvisEVO: all
    test:
      targets: [JarvisEVOTests, JarvisEVOUITests]
      gatherCoverageData: true
      environmentVariables:
        JARVIS_REQUIRE_REAL_INFERENCE: $(JARVIS_REQUIRE_REAL_INFERENCE)
